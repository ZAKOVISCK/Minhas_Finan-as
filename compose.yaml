services:
  app:
    build: .
    image: minhas-financas:${RELEASE_TAG:-local}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
