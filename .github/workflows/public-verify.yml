name: Verify published 324bae2 without paid storage
on:
  create:
permissions:
  contents: read
jobs:
  public:
    if: github.event.ref_type == 'branch' && github.event.ref == 'codex/verify-public-gratuito-324bae2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 324bae26408f6feb241ad5627b60c8ab6654ad8a
      - name: Confirm exact published source
        run: |
          test "$(git rev-parse HEAD)" = 324bae26408f6feb241ad5627b60c8ab6654ad8a
          test "$(git rev-parse 'HEAD^{tree}')" = 55c78b8e19429256c28ca08ee0ca6a485526d14b
          git rev-parse HEAD 'HEAD^{tree}'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r tests/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Verify public bytes, headers, source commit, APIs and access controls
        run: node scripts/verify-public.mjs --commit 324bae26408f6feb241ad5627b60c8ab6654ad8a --output /tmp/public-http-results.json
      - name: Verify all public browser scenarios without accepting blocked results
        if: always()
        run: python tests/compat.browser.py --browser all --require-all-scenarios --base-url https://minhas-financas-isaque.isaque-silvateixeira.chatgpt.site --allow-public-test-origin --output /tmp/public-browser-results
      - name: Print public evidence without uploading artifacts or caches
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          for filename in ('/tmp/public-http-results.json', '/tmp/public-browser-results/compat-results.json'):
              path = Path(filename)
              if not path.exists():
                  print('REPORT_MISSING: ' + filename)
                  continue
              report = json.loads(path.read_text())
              if 'counts' in report:
                  report = {key: report[key] for key in ('passed', 'counts', 'engines')}
                  for engine in report['engines']:
                      engine.pop('scenarios', None)
              value = json.dumps(report, ensure_ascii=False, indent=2)
              print(filename + '\n' + value)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('### ' + filename + '\n\n' + value + '\n\n')
          PY
