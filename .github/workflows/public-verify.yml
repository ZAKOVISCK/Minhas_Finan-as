name: Verify original public Site
on:
  workflow_dispatch:
  create:
permissions:
  contents: read
jobs:
  public:
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'codex/verify-public-'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r tests/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Verify public bytes, headers, source commit, APIs and access controls
        run: node scripts/verify-public.mjs --commit "$GITHUB_SHA" --output /tmp/public-http-results.json
      - name: Repeat compatibility scenarios in disposable profiles on the exact original domain
        if: always()
        run: python tests/compat.browser.py --browser all --base-url https://minhas-financas-isaque.isaque-silvateixeira.chatgpt.site --allow-public-test-origin --output /tmp/public-browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-verification
          path: |
            /tmp/public-http-results.json
            /tmp/public-browser-results
          if-no-files-found: error
